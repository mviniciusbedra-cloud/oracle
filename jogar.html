<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1F1A" />
    <meta name="description" content="Faz ou Bebe — o jogo de desafio pra galera. Faz o desafio ou bebe." />
    <title>FAZ OU BEBE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  --bg-0: #071612;
  --bg-1: #0d2a22;
  --bg-2: #14352b;
  --ink: #f4f0e6;
  --ink-dim: #b7c4bb;
  --lime: #d6ff3f;
  --lime-deep: #a8d600;
  --coral: #ff5a3c;
  --coral-deep: #e03d22;
  --foam: #fff8e8;
  --line: rgba(244, 240, 230, 0.14);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  --radius: 18px;
  --font-display: "Bebas Neue", Impact, sans-serif;
  --font-body: "Manrope", system-ui, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(120% 80% at 10% -10%, #1f5a45 0%, transparent 55%),
    radial-gradient(90% 70% at 100% 0%, #5a2a18 0%, transparent 50%),
    linear-gradient(165deg, var(--bg-0), var(--bg-1) 45%, #10261f 100%);
  background-attachment: fixed;
  min-height: 100dvh;
  overflow-x: hidden;
}

.noise {
  pointer-events: none;
  position: fixed;
  inset: 0;
  opacity: 0.07;
  z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.glow {
  pointer-events: none;
  position: fixed;
  width: 42vmax;
  height: 42vmax;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.22;
  z-index: 0;
  animation: drift 14s var(--ease) infinite alternate;
}

.glow-a {
  top: -10%;
  left: -8%;
  background: #c8ff4a;
}

.glow-b {
  right: -12%;
  bottom: 5%;
  background: #ff6a45;
  animation-delay: -4s;
}

@keyframes drift {
  from {
    transform: translate3d(0, 0, 0) scale(1);
  }
  to {
    transform: translate3d(4%, 6%, 0) scale(1.12);
  }
}

#app {
  position: relative;
  z-index: 1;
  width: min(440px, 100%);
  margin: 0 auto;
  min-height: 100dvh;
  padding: max(1rem, env(safe-area-inset-top)) 1.1rem max(1.4rem, env(safe-area-inset-bottom));
}

.screen {
  display: none;
  flex-direction: column;
  gap: 1.25rem;
  min-height: calc(100dvh - 2.4rem);
  animation: rise 0.55s var(--ease);
}

.screen.is-active {
  display: flex;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-top: 8vh;
}

.kicker {
  margin: 0 0 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--lime);
}

.brand {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(5.4rem, 24vw, 7.2rem);
  line-height: 0.86;
  letter-spacing: 0.02em;
  color: var(--foam);
}

.brand span {
  display: block;
}

.brand-mid {
  color: var(--coral);
  font-size: 0.42em;
  letter-spacing: 0.28em;
  margin: 0.15em 0 0.05em;
}

.tagline {
  margin: 1.35rem 0 0;
  max-width: 18ch;
  font-size: 1.15rem;
  line-height: 1.45;
  font-weight: 600;
  color: var(--ink-dim);
}

.cta-row {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  margin-top: 2rem;
}

.home-foot {
  margin-top: auto;
  padding-top: 2rem;
}

.home-foot p {
  margin: 0;
  font-size: 0.82rem;
  color: var(--ink-dim);
  opacity: 0.85;
}

.btn,
.btn-ghost,
.choice {
  font: inherit;
  cursor: pointer;
  border: none;
  appearance: none;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3.25rem;
  padding: 0.85rem 1.35rem;
  border-radius: 999px;
  font-weight: 800;
  letter-spacing: 0.02em;
  transition: transform 0.2s var(--ease), background 0.2s ease, color 0.2s ease;
}

.btn:active {
  transform: scale(0.98);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--lime);
  color: #102016;
}

.btn-primary:hover:not(:disabled) {
  background: #e8ff74;
}

.btn-secondary {
  background: transparent;
  color: var(--ink);
  border: 1.5px solid var(--line);
}

.btn-secondary:hover {
  border-color: rgba(244, 240, 230, 0.35);
  background: rgba(255, 255, 255, 0.04);
}

.btn-drink {
  background: var(--coral);
  color: var(--foam);
}

.btn-drink:hover {
  background: #ff7358;
}

.btn-ghost {
  background: transparent;
  color: var(--ink);
  min-width: 2.5rem;
  min-height: 2.5rem;
  border-radius: 12px;
  font-size: 1.15rem;
  opacity: 0.85;
}

.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.06);
}

.screen-head {
  display: grid;
  grid-template-columns: 2.5rem 1fr 2.5rem;
  align-items: center;
  gap: 0.5rem;
}

.screen-head h2,
.screen-head .who-plays,
.screen-head .round-label {
  margin: 0;
  text-align: center;
  font-size: 1.05rem;
  font-weight: 700;
}

.screen-head.compact {
  margin-bottom: 0.25rem;
}

.player-form .field {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}

.player-form .field > span,
.level-pick legend {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.field-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.55rem;
}

input[type="text"] {
  width: 100%;
  min-height: 3.1rem;
  padding: 0.75rem 1rem;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: rgba(7, 22, 18, 0.55);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  outline: none;
}

input[type="text"]:focus {
  border-color: rgba(214, 255, 63, 0.55);
}

input[type="text"]::placeholder {
  color: rgba(183, 196, 187, 0.55);
}

.player-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.55rem;
  min-height: 2.5rem;
}

.player-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.45rem 0.55rem 0.45rem 0.85rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
  font-weight: 700;
  font-size: 0.92rem;
  animation: pop 0.35s var(--ease);
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(0.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.player-chip button {
  width: 1.55rem;
  height: 1.55rem;
  border: none;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.25);
  color: var(--ink);
  cursor: pointer;
  font-size: 0.85rem;
  line-height: 1;
}

.level-pick {
  margin: 0.5rem 0 0;
  padding: 0;
  border: none;
}

.level-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.55rem;
  margin-top: 0.65rem;
}

.level-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  padding: 0.9rem 0.55rem;
  border-radius: var(--radius);
  border: 1.5px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s var(--ease);
}

.level-card:hover {
  transform: translateY(-2px);
}

.level-card:has(input:checked) {
  border-color: var(--lime);
  background: rgba(214, 255, 63, 0.1);
}

.level-card input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.level-name {
  font-family: var(--font-display);
  font-size: 1.45rem;
  letter-spacing: 0.04em;
}

.level-desc {
  font-size: 0.72rem;
  color: var(--ink-dim);
  font-weight: 600;
}

.sticky-cta {
  margin-top: auto;
}

.hint {
  margin: 0;
  text-align: center;
  font-size: 0.82rem;
  color: var(--ink-dim);
}

.spin-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 1rem;
}

.spin-label {
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--ink-dim);
}

.spin-name {
  font-family: var(--font-display);
  font-size: clamp(3.6rem, 16vw, 5.2rem);
  line-height: 0.95;
  letter-spacing: 0.03em;
  min-height: 1.1em;
  color: var(--lime);
  transition: transform 0.12s linear, color 0.12s linear;
}

.spin-name.is-spinning {
  color: var(--foam);
}

.spin-name.is-locked {
  animation: lock-in 0.55s var(--ease);
  color: var(--lime);
}

@keyframes lock-in {
  0% {
    transform: scale(0.9);
  }
  55% {
    transform: scale(1.08);
  }
  100% {
    transform: scale(1);
  }
}

.btn-spin {
  margin-top: 1.5rem;
  min-width: 12rem;
}

.choice-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  margin-top: 1rem;
}

.choice {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.15rem;
  min-height: 11rem;
  padding: 1.15rem 1rem 1.25rem;
  border-radius: 22px;
  text-align: left;
  transition: transform 0.25s var(--ease), box-shadow 0.25s ease;
}

.choice:hover {
  transform: translateY(-4px);
}

.choice-faz {
  background: linear-gradient(160deg, #e8ff74 0%, #b6e018 100%);
  color: #132015;
}

.choice-bebe {
  background: linear-gradient(160deg, #ff7a5c 0%, #e03d22 100%);
  color: #fff5ef;
}

.choice-kicker {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.7;
}

.choice-title {
  font-family: var(--font-display);
  font-size: 3.4rem;
  line-height: 0.9;
  letter-spacing: 0.02em;
  margin-top: 0.35rem;
}

.choice-sub {
  margin-top: auto;
  font-size: 0.9rem;
  font-weight: 700;
  opacity: 0.8;
}

.challenge-card {
  margin-top: 0.5rem;
  padding: 1.4rem 1.2rem 1.25rem;
  border-radius: 24px;
  background: rgba(8, 24, 20, 0.72);
  border: 1.5px solid var(--line);
  backdrop-filter: blur(10px);
  animation: rise 0.45s var(--ease);
}

.challenge-card[data-kind="faz"] {
  border-color: rgba(214, 255, 63, 0.35);
}

.challenge-card[data-kind="bebe"] {
  border-color: rgba(255, 90, 60, 0.4);
}

.challenge-type {
  margin: 0 0 0.55rem;
  font-family: var(--font-display);
  font-size: 1.5rem;
  letter-spacing: 0.12em;
  color: var(--lime);
}

.challenge-card[data-kind="bebe"] .challenge-type {
  color: var(--coral);
}

.challenge-text {
  margin: 0;
  font-size: clamp(1.35rem, 5.2vw, 1.7rem);
  line-height: 1.28;
  font-weight: 800;
}

.challenge-meta {
  margin: 0.85rem 0 0;
  font-size: 0.88rem;
  color: var(--ink-dim);
  font-weight: 600;
}

.challenge-actions {
  display: grid;
  gap: 0.55rem;
  margin-top: 1.4rem;
}

.scores-dialog {
  width: min(420px, calc(100vw - 1.5rem));
  margin: auto;
  padding: 0;
  border: 1.5px solid var(--line);
  border-radius: 22px;
  background: #0d241e;
  color: var(--ink);
  box-shadow: var(--shadow);
}

.scores-dialog::backdrop {
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px);
}

.scores-panel {
  padding: 1.1rem 1.1rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.scores-panel header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.scores-panel h2 {
  margin: 0;
  font-size: 1.15rem;
}

.scores-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
}

.scores-list li {
  display: grid;
  grid-template-columns: 1.4rem 1fr auto;
  gap: 0.55rem;
  align-items: center;
  padding: 0.7rem 0.8rem;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line);
  font-weight: 700;
}

.scores-list .rank {
  color: var(--lime);
  font-family: var(--font-display);
  font-size: 1.2rem;
}

.scores-list .stat {
  font-size: 0.78rem;
  color: var(--ink-dim);
  font-weight: 600;
  text-align: right;
}

@media (min-width: 720px) {
  #app {
    width: min(480px, 100%);
    padding-top: 2rem;
  }

  .brand {
    font-size: 7.5rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}

</style>
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>

    <main id="app">
      <!-- HOME -->
      <section id="screen-home" class="screen is-active" data-screen="home">
        <div class="hero">
          <p class="kicker">pra jogar de galera</p>
          <h1 class="brand">
            <span>FAZ</span>
            <span class="brand-mid">OU</span>
            <span>BEBE</span>
          </h1>
          <p class="tagline">Sorteia um desafio. Faz… ou bebe. Sem desculpa.</p>
          <div class="cta-row">
            <button type="button" class="btn btn-primary" data-go="setup">
              Montar a roda
            </button>
          </div>
        </div>
        <footer class="home-foot">
          <p>Passe o celular. Ria. Hidrate. Jogue com consentimento.</p>
        </footer>
      </section>

      <!-- SETUP -->
      <section id="screen-setup" class="screen" data-screen="setup" hidden>
        <header class="screen-head">
          <button type="button" class="btn-ghost" data-go="home" aria-label="Voltar">←</button>
          <h2>Quem tá na mesa?</h2>
        </header>

        <form id="player-form" class="player-form" autocomplete="off">
          <label class="field">
            <span>Nome do jogador</span>
            <div class="field-row">
              <input
                id="player-input"
                name="player"
                type="text"
                maxlength="18"
                placeholder="Ex: Biia, Dudu, Ana…"
                required
              />
              <button type="submit" class="btn btn-secondary">Add</button>
            </div>
          </label>
        </form>

        <ul id="player-list" class="player-list" aria-live="polite"></ul>

        <fieldset class="level-pick">
          <legend>Nível da noite</legend>
          <div class="level-grid" role="radiogroup" aria-label="Nível">
            <label class="level-card">
              <input type="radio" name="level" value="leve" checked />
              <span class="level-name">Leve</span>
              <span class="level-desc">risada e gelo</span>
            </label>
            <label class="level-card">
              <input type="radio" name="level" value="medio" />
              <span class="level-name">Médio</span>
              <span class="level-desc">já esquenta</span>
            </label>
            <label class="level-card">
              <input type="radio" name="level" value="pesado" />
              <span class="level-name">Pesado</span>
              <span class="level-desc">sem filtro</span>
            </label>
          </div>
        </fieldset>

        <div class="cta-row sticky-cta">
          <button type="button" id="btn-start" class="btn btn-primary" disabled>
            Começar a noite
          </button>
          <p id="setup-hint" class="hint">Adiciona pelo menos 2 pessoas</p>
        </div>
      </section>

      <!-- SPIN -->
      <section id="screen-spin" class="screen" data-screen="spin" hidden>
        <header class="screen-head compact">
          <button type="button" class="btn-ghost" data-go="setup" aria-label="Voltar">←</button>
          <p class="round-label">Rodada <span id="round-num">1</span></p>
          <button type="button" class="btn-ghost" id="btn-scores" aria-label="Placar">★</button>
        </header>

        <div class="spin-stage">
          <p class="spin-label">A vez é de…</p>
          <div id="spin-name" class="spin-name" aria-live="assertive">?</div>
          <button type="button" id="btn-spin" class="btn btn-primary btn-spin">
            Girar a roda
          </button>
        </div>
      </section>

      <!-- CHALLENGE -->
      <section id="screen-challenge" class="screen" data-screen="challenge" hidden>
        <header class="screen-head compact">
          <button type="button" class="btn-ghost" id="btn-back-spin" aria-label="Voltar">←</button>
          <p class="who-plays"><span id="current-player">—</span>, é contigo</p>
          <button type="button" class="btn-ghost" id="btn-scores-2" aria-label="Placar">★</button>
        </header>

        <div class="choice-row" id="choice-row">
          <button type="button" class="choice choice-faz" data-pick="faz">
            <span class="choice-kicker">escolhe</span>
            <span class="choice-title">FAZ</span>
            <span class="choice-sub">desafio</span>
          </button>
          <button type="button" class="choice choice-bebe" data-pick="bebe">
            <span class="choice-kicker">ou</span>
            <span class="choice-title">BEBE</span>
            <span class="choice-sub">gole forçado</span>
          </button>
        </div>

        <article id="challenge-card" class="challenge-card" hidden>
          <p class="challenge-type" id="challenge-type">FAZ</p>
          <h2 class="challenge-text" id="challenge-text"></h2>
          <p class="challenge-meta" id="challenge-meta"></p>
          <div class="challenge-actions">
            <button type="button" class="btn btn-primary" id="btn-did-it">Fez!</button>
            <button type="button" class="btn btn-drink" id="btn-drank">Bebeu</button>
            <button type="button" class="btn btn-secondary" id="btn-reroll">Trocar desafio</button>
          </div>
        </article>
      </section>

      <!-- SCORES overlay -->
      <dialog id="scores-dialog" class="scores-dialog">
        <form method="dialog" class="scores-panel">
          <header>
            <h2>Placar da noite</h2>
            <button type="submit" class="btn-ghost" aria-label="Fechar">✕</button>
          </header>
          <ol id="scores-list" class="scores-list"></ol>
          <button type="button" class="btn btn-secondary" id="btn-reset-night">
            Encerrar noite
          </button>
        </form>
      </dialog>
    </main>

    <script>
/** Desafios do Faz ou Bebe — níveis leve / médio / pesado */
window.CHALLENGES = {
  faz: {
    leve: [
      "Imite a pessoa à sua esquerda por 20 segundos.",
      "Conte a pior piada que você conhece. Se ninguém rir, bebe 1 gole.",
      "Fale com sotaque carioca até a próxima rodada.",
      "Mande um áudio constrangedor pra alguém da roda (com permissão).",
      "Dance por 15 segundos sem música.",
      "Troque de lugar com quem estiver na sua frente.",
      "Fale 3 qualidades da pessoa à sua direita.",
      "Faça uma cara de sério e tente não rir por 20 segundos enquanto a galera provoca.",
      "Conte um fato aleatório e inútil sobre você.",
      "Cante o refrão de uma música escolhida pela mesa.",
      "Fale só em perguntas até a próxima vez que jogar.",
      "Invente um apelido novo pra cada pessoa da mesa.",
      "Faça uma declaração dramática de amizade pra alguém.",

(() => {
const { CHALLENGES } = window;

const state = {
  players: [],
  level: "leve",
  round: 1,
  currentPlayerId: null,
  lastPick: null,
  used: {
    faz: new Set(),
    bebe: new Set(),
  },
  spinning: false,
};

const els = {
  screens: [...document.querySelectorAll(".screen")],
  playerForm: document.getElementById("player-form"),
  playerInput: document.getElementById("player-input"),
  playerList: document.getElementById("player-list"),
  btnStart: document.getElementById("btn-start"),
  setupHint: document.getElementById("setup-hint"),
  roundNum: document.getElementById("round-num"),
  spinName: document.getElementById("spin-name"),
  btnSpin: document.getElementById("btn-spin"),
  currentPlayer: document.getElementById("current-player"),
  choiceRow: document.getElementById("choice-row"),
  challengeCard: document.getElementById("challenge-card"),
  challengeType: document.getElementById("challenge-type"),
  challengeText: document.getElementById("challenge-text"),
  challengeMeta: document.getElementById("challenge-meta"),
  btnDidIt: document.getElementById("btn-did-it"),
  btnDrank: document.getElementById("btn-drank"),
  btnReroll: document.getElementById("btn-reroll"),
  btnBackSpin: document.getElementById("btn-back-spin"),
  scoresDialog: document.getElementById("scores-dialog"),
  scoresList: document.getElementById("scores-list"),
  btnResetNight: document.getElementById("btn-reset-night"),
};

function uid() {
  return crypto.randomUUID?.() ?? `p-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function go(screen) {
  els.screens.forEach((s) => {
    const active = s.dataset.screen === screen;
    s.classList.toggle("is-active", active);
    s.hidden = !active;
  });
}

function getLevel() {
  const checked = document.querySelector('input[name="level"]:checked');
  return checked?.value ?? "leve";
}

function normalizeName(name) {
  return name.trim().replace(/\s+/g, " ");
}

function renderPlayers() {
  els.playerList.innerHTML = "";
  state.players.forEach((p) => {
    const li = document.createElement("li");
    li.className = "player-chip";
    li.innerHTML = `<span>${escapeHtml(p.name)}</span>`;
    const remove = document.createElement("button");
    remove.type = "button";
    remove.setAttribute("aria-label", `Remover ${p.name}`);
    remove.textContent = "×";
    remove.addEventListener("click", () => {
      state.players = state.players.filter((x) => x.id !== p.id);
      renderPlayers();
      syncSetup();
    });
    li.appendChild(remove);
    els.playerList.appendChild(li);
  });
  syncSetup();
}

function syncSetup() {
  const ok = state.players.length >= 2;
  els.btnStart.disabled = !ok;
  els.setupHint.textContent = ok
    ? `${state.players.length} na mesa · pronto pra começar`
    : "Adiciona pelo menos 2 pessoas";
}

function escapeHtml(str) {
  return str
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function addPlayer(raw) {
  const name = normalizeName(raw);
  if (!name) return;
  if (state.players.some((p) => p.name.toLowerCase() === name.toLowerCase())) {
    els.playerInput.value = "";
    els.playerInput.placeholder = "Esse nome já tá na mesa";
    return;
  }
  state.players.push({
    id: uid(),
    name,
    did: 0,
    drank: 0,
  });
  els.playerInput.value = "";
  els.playerInput.placeholder = "Ex: Biia, Dudu, Ana…";
  renderPlayers();
}

function startNight() {
  state.level = getLevel();
  state.round = 1;
  state.currentPlayerId = null;
  state.lastPick = null;
  state.used = { faz: new Set(), bebe: new Set() };
  state.players.forEach((p) => {
    p.did = 0;
    p.drank = 0;
  });
  els.roundNum.textContent = String(state.round);
  els.spinName.textContent = "?";
  els.spinName.classList.remove("is-spinning", "is-locked");
  els.btnSpin.disabled = false;
  els.btnSpin.textContent = "Girar a roda";
  go("spin");
}

function currentPlayer() {
  return state.players.find((p) => p.id === state.currentPlayerId) ?? null;
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function spinWheel() {
  if (state.spinning || state.players.length < 2) return;
  state.spinning = true;
  els.btnSpin.disabled = true;
  els.spinName.classList.add("is-spinning");
  els.spinName.classList.remove("is-locked");

  const ticks = 18 + Math.floor(Math.random() * 8);
  let delay = 45;
  let pick = state.players[0];

  for (let i = 0; i < ticks; i += 1) {
    pick = state.players[Math.floor(Math.random() * state.players.length)];
    els.spinName.textContent = pick.name;
    await sleep(delay);
    delay += 12;
  }

  // Evita repetir a mesma pessoa duas vezes seguidas quando dá
  if (state.players.length > 1 && pick.id === state.currentPlayerId) {
    const others = state.players.filter((p) => p.id !== state.currentPlayerId);
    pick = others[Math.floor(Math.random() * others.length)];
    els.spinName.textContent = pick.name;
  }

  state.currentPlayerId = pick.id;
  els.spinName.classList.remove("is-spinning");
  els.spinName.classList.add("is-locked");
  await sleep(450);
  state.spinning = false;
  openChallengeScreen();
}

function openChallengeScreen() {
  const player = currentPlayer();
  if (!player) return;
  els.currentPlayer.textContent = player.name;
  els.choiceRow.hidden = false;
  els.challengeCard.hidden = true;
  state.lastPick = null;
  go("challenge");
}

function poolFor(kind) {
  const list = CHALLENGES[kind][state.level] ?? CHALLENGES[kind].leve;
  const used = state.used[kind];
  const fresh = list
    .map((text, index) => ({ text, index }))
    .filter((item) => !used.has(item.index));
  if (fresh.length === 0) {
    used.clear();
    return list.map((text, index) => ({ text, index }));
  }
  return fresh;
}

function drawChallenge(kind, { reroll = false } = {}) {
  const pool = poolFor(kind);
  const item = pool[Math.floor(Math.random() * pool.length)];
  state.used[kind].add(item.index);
  state.lastPick = kind;

  els.choiceRow.hidden = true;
  els.challengeCard.hidden = false;
  els.challengeCard.dataset.kind = kind;
  els.challengeType.textContent = kind === "faz" ? "FAZ" : "BEBE";
  els.challengeText.textContent = item.text;
  const levelLabel = { leve: "Leve", medio: "Médio", pesado: "Pesado" }[state.level];
  els.challengeMeta.textContent = reroll
    ? `Nível ${levelLabel} · desafio trocado`
    : `Nível ${levelLabel} · ${kind === "faz" ? "faz o desafio ou bebe de castigo" : "bora hidratar"}`;
}

function finishTurn(action) {
  const player = currentPlayer();
  if (!player) return;
  if (action === "did") player.did += 1;
  if (action === "drank") player.drank += 1;
  state.round += 1;
  els.roundNum.textContent = String(state.round);
  els.spinName.textContent = "?";
  els.spinName.classList.remove("is-locked", "is-spinning");
  els.btnSpin.disabled = false;
  els.btnSpin.textContent = "Girar a roda";
  go("spin");
}

function renderScores() {
  const ranked = [...state.players].sort((a, b) => b.did + b.drank - (a.did + a.drank));
  els.scoresList.innerHTML = "";
  ranked.forEach((p, i) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="rank">${i + 1}</span>
      <span>${escapeHtml(p.name)}</span>
      <span class="stat">${p.did} fez · ${p.drank} bebeu</span>
    `;
    els.scoresList.appendChild(li);
  });
}

function openScores() {
  renderScores();
  els.scoresDialog.showModal();
}

function resetNight() {
  els.scoresDialog.close();
  state.currentPlayerId = null;
  state.round = 1;
  state.used = { faz: new Set(), bebe: new Set() };
  state.players.forEach((p) => {
    p.did = 0;
    p.drank = 0;
  });
  go("setup");
}

// Events
document.querySelectorAll("[data-go]").forEach((btn) => {
  btn.addEventListener("click", () => go(btn.dataset.go));
});

els.playerForm.addEventListener("submit", (e) => {
  e.preventDefault();
  addPlayer(els.playerInput.value);
});

els.btnStart.addEventListener("click", startNight);
els.btnSpin.addEventListener("click", spinWheel);
els.btnBackSpin.addEventListener("click", () => go("spin"));

document.querySelectorAll("[data-pick]").forEach((btn) => {
  btn.addEventListener("click", () => drawChallenge(btn.dataset.pick));
});

els.btnDidIt.addEventListener("click", () => finishTurn("did"));
els.btnDrank.addEventListener("click", () => finishTurn("drank"));
els.btnReroll.addEventListener("click", () => {
  if (!state.lastPick) return;
  drawChallenge(state.lastPick, { reroll: true });
});

document.getElementById("btn-scores").addEventListener("click", openScores);
document.getElementById("btn-scores-2").addEventListener("click", openScores);
els.btnResetNight.addEventListener("click", resetNight);

// boot
renderPlayers();
go("home");
})();

</script>
  </body>
</html>
